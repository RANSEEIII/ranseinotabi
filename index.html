<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Campfire Journal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background -->
  <img id="background" src="campfire.gif" alt="Campfire" />

  <!-- Journal (closed) -->
  <img id="journal" src="journal.png" alt="Journal" />

  <a id="tent-click-area" href="https://www.youtube.com/watch?v=rVF0YDj5dTc" target="_blank"></a>

  <!-- Opened Journal here-->
  <div id="journal-container" style="display: none;">
    <div id="page-wrapper">
  <img id="journal-page" src="journal_open.png" alt="Journal Page" />
  <a id="polaroid-link-1" href="https://www.youtube.com/watch?v=xkShPFS5zC4" target="_blank"></a>
  <a id="polaroid-link-2" href="https://www.youtube.com/watch?v=Goq6xNC-o5c" target="_blank"></a>
  <a id="polaroid-link-3" href="https://www.youtube.com/watch?v=i1gjhIWeZ2c" target="_blank"></a>
  <a id="polaroid-link-4" href="https://www.youtube.com/watch?v=u9P0BVvSElo" target="_blank"></a>
  <a id="polaroid-link-5" href="https://www.youtube.com/watch?v=05zIDoXcKms" target="_blank"></a>
  <a id="polaroid-link-6" href="https://www.youtube.com/watch?v=CGHDsEyptyQ" target="_blank"></a>
  <a id="polaroid-link-7" href="https://www.youtube.com/watch?v=E_93XqWBTxQ" target="_blank"></a>
</div>
    
    <div id="nav-left"></div>
    <div id="nav-right"></div>
  </div>

  <!-- Audio -->
  <audio id="bg-sound" loop>
    <source src="fire.mp3" type="audio/mpeg" />
  </audio>
  <audio id="flip-sound" src="flip.mp3"></audio>

  <!-- Script -->
  <script>
    const journal = document.getElementById('journal');
    const container = document.getElementById('journal-container');
    const pageImg = document.getElementById('journal-page');
    const flipSound = document.getElementById('flip-sound');
    const bgSound = document.getElementById('bg-sound');

    const pages = ['journal_open.png', 'journal_1.png', 'journal_2.png', 'journal_3.png', 'journal_4.png', 'journal_5.png', 'journal_6.png', 'journal_7.png'];
    let currentPage = 0;

    journal.addEventListener('click', () => {
      journal.style.display = 'none';
      container.style.display = 'block';
      pageImg.src = pages[currentPage];

      if (bgSound.paused) {
        bgSound.play().catch(e => console.warn('Autoplay blocked:', e));
      }
    });

function flipToPage(index) {
  if (index >= 0 && index < pages.length) {
    currentPage = index;
    pageImg.src = pages[currentPage];
    flipSound.play();

    const link1 = document.getElementById('polaroid-link-1');
    const link2 = document.getElementById('polaroid-link-2');
    const link3 = document.getElementById('polaroid-link-3');
    const link4 = document.getElementById('polaroid-link-4');
    const link5 = document.getElementById('polaroid-link-5');
    const link6 = document.getElementById('polaroid-link-6');
    const link6 = document.getElementById('polaroid-link-7');

    link1.style.display = 'none';
    link2.style.display = 'none';
    link3.style.display = 'none';
    link4.style.display = 'none';
    link5.style.display = 'none';

    if (currentPage === 1) {
      link1.style.display = 'block';
    } else if (currentPage === 2) {
      link2.style.display = 'block';
    } else if (currentPage === 3) {
      link3.style.display = 'block';
    } else if (currentPage === 4) {
      link4.style.display = 'block';
    } else if (currentPage === 5) {
      link5.style.display = 'block'
    } else if (currentPage === 6) {
      link6.style.display = 'block' 
    } else if (currentPage === 7) {
      link7.style.display = 'block';
    }
  }
}


    document.getElementById('nav-left').addEventListener('click', () => {
      if (currentPage > 0) {
        flipToPage(currentPage - 1);
      }
    });

    document.getElementById('nav-right').addEventListener('click', () => {
      if (currentPage < pages.length - 1) {
        flipToPage(currentPage + 1);
      }
    });

document.addEventListener('click', (e) => {
  const tentArea = document.getElementById('tent-click-area');
  if (
    container.style.display === 'block' &&
    !container.contains(e.target) &&
    e.target !== journal &&
    !tentArea.contains(e.target)
  ) {
    container.style.display = 'none';
    journal.style.display = 'block';
    currentPage = 0;
    pageImg.src = pages[currentPage];
  }

    });
  </script>
</body>
</html>
